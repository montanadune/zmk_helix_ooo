# ZMK Studio を有効化
CONFIG_ZMK_STUDIO=y
# 毎回ロック解除キー(&studio_unlock)を押さずにStudio接続したい場合は n、ロックを有効にしたい場合は y
CONFIG_ZMK_STUDIO_LOCKING=n

# Bluetooth電波強度アップ（元の設定を維持）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Copyright (c) 2020 The ZMK Contributors
# SPDX-License-Identifier: MIT

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# 【追加】サスペンド復帰時のBLEネゴシエーション失敗を防ぐ
CONFIG_BT_CTLR_PHY_2M=n

# 【追加】ディープスリープによるコールドブート（再起動）を防ぐ
CONFIG_ZMK_SLEEP=n

# DYA Studio 拡張サブシステムの有効化
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_SETTINGS_RPC=y
